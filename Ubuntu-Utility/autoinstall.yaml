autoinstall:
  version: 1

  # ---------------------------------------------------------------------------
  # Pacchetti APT
  # Sincronizzato con i pacchetti installati manualmente sul PC (ottobre 2026)
  # ---------------------------------------------------------------------------
  packages:
    # --- Rete e certificati ---
    - ca-certificates
    - curl
    - gnupg
    - lsb-release
    - wget
    - apt-transport-https
    - net-tools

    # --- Ottimizzazione sistema ---
    - zram-config


    # --- Pacchetti base sviluppo ---
    - build-essential
    - git
    - git-lfs
    - git-filter-repo
    - cmake
    - gdebi
    - dos2unix
    - zenity
    - ripgrep

    # --- Java ---
    - openjdk-21-jdk

    # --- Database ---
    - postgresql
    - redis

    # --- Rete anonima ---
    - tor

    # --- Grafica e multimedia ---
    - vlc
    - gparted

    # --- Virtualizzazione e multimedia aggiuntivi ---
    - virtualbox
    - mpv
    - ffmpeg
    - scrcpy

    # --- Documentazione e LaTeX ---
    - graphviz
    - latexmk
    - texlive-latex-base
    - texlive-latex-extra
    - texlive-latex-recommended
    - texlive-fonts-recommended
    - texlive-pictures
    - texlive-science
    # --- Driver ---
    - hplip
    - hplip-gui

    # --- Strumenti sistema ---
    - linux-tools-common

    # --- Desktop GNOME ---
    - gnome-tweaks
    - ptyxis
    - stacer
    - bleachbit

    # --- Localizzazione italiana ---
    - language-pack-it
    - language-pack-it-base
    - language-pack-gnome-it
    - language-pack-gnome-it-base
    - mythes-it
    - hyphen-it
    - libreoffice-l10n-it
    - libreoffice-help-it

  # ---------------------------------------------------------------------------
  # Comandi post-installazione
  # ---------------------------------------------------------------------------
  late-commands:
    # --- Aggiornamento sistema ---
    - curtin in-target -- apt update
    - curtin in-target -- apt upgrade -y

    # --- Git ---
    - curtin in-target -- apt install -y git-lfs
    - curtin in-target -- git lfs install
    - curtin in-target -- git config --global user.email "g.pandozzitrani@studenti.unina.it"
    - curtin in-target -- git config --global user.name "kenobi1797"

    # --- PostgreSQL ---
    - curtin in-target -- bash -c "sudo -u postgres psql -c \"ALTER USER postgres WITH PASSWORD 'postgres';\""

    # --- Servizi ---
    - curtin in-target -- systemctl start tor
    - curtin in-target -- systemctl enable tor
    - curtin in-target -- systemctl start redis-server
    - curtin in-target -- systemctl enable redis-server

    # --- Google Chrome ---
    - curtin in-target -- bash -c 'wget -q --show-progress https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/google-chrome.deb'
    - curtin in-target -- bash -c 'dpkg -i /tmp/google-chrome.deb || apt-get install -f -y'
    - curtin in-target -- rm -f /tmp/google-chrome.deb

    # --- GitHub Desktop ---
    - curtin in-target -- bash -c 'wget -q --show-progress https://github.com/shiftkey/desktop/releases/download/release-2.8.1-linux2/GitHubDesktop-linux-2.8.1-linux2.deb -O /tmp/github-desktop.deb'
    - curtin in-target -- bash -c 'dpkg -i /tmp/github-desktop.deb || apt-get install -f -y'
    - curtin in-target -- rm -f /tmp/github-desktop.deb

    # --- Visual Studio Code via APT (formato deb822, coerente con quello generato da apt) ---
    - curtin in-target -- bash -c 'wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /usr/share/keyrings/microsoft.gpg'
    - "curtin in-target -- bash -c 'printf \"Types: deb\\nURIs: https://packages.microsoft.com/repos/code\\nSuites: stable\\nComponents: main\\nArchitectures: amd64\\nSigned-By: /usr/share/keyrings/microsoft.gpg\\n\" > /etc/apt/sources.list.d/vscode.sources'"
    - curtin in-target -- apt update
    - curtin in-target -- apt install -y code

    # --- Estensioni VS Code (per l'utente reale, non root) ---
    - >-
      curtin in-target -- bash -c 'USER_NAME=$(getent passwd 1000 | cut -d: -f1);
      for ext in abians.prisma-generate-uml alefragnani.project-manager anthropic.claude-code
      christian-kohler.npm-intellisense christian-kohler.path-intellisense codezombiech.gitignore
      cschlosser.doxdocgen databricks.neon-local-connect dbaeumer.vscode-eslint
      dsznajder.es7-react-js-snippets eamodio.gitlens formulahendry.docker-explorer
      formulahendry.docker-extension-pack github.vscode-github-actions github.vscode-pull-request-github
      james-yu.latex-workshop jasonnutter.search-node-modules jawandarajbir.react-vscode-extension-pack
      jebbs.plantuml mathiasfrohlich.kotlin mhutchie.git-graph ms-azuretools.vscode-bicep
      ms-azuretools.vscode-containers ms-azuretools.vscode-docker ms-ceintl.vscode-language-pack-it
      ms-dotnettools.csharp ms-dotnettools.vscode-dotnet-runtime ms-playwright.playwright
      ms-python.debugpy ms-python.python ms-python.vscode-pylance ms-python.vscode-python-envs
      ms-vscode-remote.remote-containers ms-vscode.cmake-tools ms-vscode.cpp-devtools ms-vscode.cpptools
      ms-vscode.cpptools-extension-pack ms-vscode.cpptools-themes ms-vscode.makefile-tools
      ms-vscode.remote-repositories ms-vscode.vscode-typescript-next naco-siren.gradle-language
      redhat.java redhat.vscode-xml richardwillis.vscode-gradle-extension-pack rust-lang.rust-analyzer
      segerdekort.angular-cli sohibe.java-generate-setters-getters sonarsource.sonarlint-vscode
      sondermx.java-kits steoates.autoimport tomoki1207.pdf tomoyukim.vscode-mermaid-editor
      typescriptteam.native-preview vmware.vscode-spring-boot vscjava.vscode-gradle
      vscjava.vscode-java-debug vscjava.vscode-java-dependency vscjava.vscode-java-pack
      vscjava.vscode-java-test vscjava.vscode-maven vscjava.vscode-spring-boot-dashboard
      vscjava.vscode-spring-initializr xabikos.javascriptsnippets xabikos.reactsnippets
      yangbaopan.vscode-java-ibatisx; do su - "$USER_NAME" -c "code --install-extension $ext --force"; done'

    # --- Rust (per l'utente reale, non root) ---
    - curtin in-target -- bash -c 'USER_NAME=$(getent passwd 1000 | cut -d: -f1); su - "$USER_NAME" -c "curl --proto=https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y"'

    # --- Snap: strumenti sviluppo ---
    - curtin in-target -- snap install --classic openjdk
    - curtin in-target -- snap install --classic android-studio
    - curtin in-target -- snap install --classic eclipse
    - curtin in-target -- snap install intellij-idea-ultimate --classic
    - curtin in-target -- snap install node --classic

    # --- Snap: app desktop ---
    - curtin in-target -- snap install telegram-desktop
    - curtin in-target -- snap install teams-for-linux
    - curtin in-target -- snap install perplexity-desktop
    - curtin in-target -- snap install pgadmin4
    - curtin in-target -- snap install firefox           # [AGGIUNTO] presente sul PC
    - curtin in-target -- snap install thunderbird       # [AGGIUNTO] presente sul PC

    # --- Docker ---
    - curtin in-target -- snap install docker
    - curtin in-target -- snap start docker
    - curtin in-target -- bash -c 'groupadd docker || true'
    - curtin in-target -- bash -c 'usermod -aG docker "$(getent passwd 1000 | cut -d: -f1)"'

  interactive-sections:
    - identity